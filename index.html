<!DOCTYPE html>
<html lang="fr">
<head>

<title>VERA COSMIQUE - LUXE</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:'Poppins',sans-serif;background:#fdfcf7;color:#1a2e1a}
header{position:fixed;top:0;width:100%;z-index:1000;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(20,69,42,0.08);padding:0}
.header-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.logo{font-family:'Playfair Display',serif;font-weight:900;color:#0f2e1c;line-height:0.9;font-size:22px;letter-spacing:2px}
.logo small{font-size:10px;letter-spacing:4px;color:#c9a227;font-weight:600;display:block;margin-top:3px}
.search-row{padding:0 16px 12px}
.search{display:flex;align-items:center;background:#f2f5f0;border-radius:30px;padding:10px 16px;border:1px solid #e0e8d6}
.search input{flex:1;border:none;background:transparent;outline:none;font-size:13px}
.btn-top{background:#0f2e1c;color:#d4c06a;padding:10px 18px;border-radius:30px;text-decoration:none;font-weight:800;font-size:13px}
.hero{height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:130px 20px 20px;background:radial-gradient(circle at top,#eef5ee,#fdfcf7)}
.hero h1{font-family:'Playfair Display',serif;font-size:42px;font-weight:900;color:#0f2e1c;line-height:0.95}
.hero h1 span{color:#c9a227;display:block;font-size:36px;font-style:italic}
.hero p{color:#6b8a6b;margin:12px 0;letter-spacing:3px;font-size:12px;font-weight:600}
.hero img{width:90%;max-width:380px;border-radius:30px;box-shadow:0 30px 60px rgba(20,69,42,0.18);margin:20px 0}
/* reste de ton CSS luxe identique */
.filters{position:sticky;top:108px;z-index:999;display:flex;gap:10px;padding:14px 18px;overflow:auto;background:rgba(253,252,247,0.9);backdrop-filter:blur(10px);border-bottom:1px solid #eee}
.f{border:1px solid #e0e8d6;padding:8px 18px;border-radius:30px;font-size:12px;white-space:nowrap;background:white;cursor:pointer;font-weight:600;color:#0f2e1c}.f.active{background:#0f2e1c;color:#d4c06a}
.container{max-width:520px;margin:0 auto;padding:20px 16px;background:white}
.card{border:1px solid #eef2e8;border-radius:26px;padding:18px;margin:22px 0;background:white;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.04);transition:0.4s}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(20,69,42,0.12)}
.card img{width:100%;border-radius:18px;object-fit:contain;max-height:440px}
.prix{font-size:38px;font-weight:900;color:#0f2e1c;margin:12px 0;font-family:'Playfair Display'}
.btn-card{display:block;padding:15px;border-radius:30px;text-decoration:none;font-weight:800;color:white;margin-top:12px}
</style>
</head>
<body>
<header>
<div class="header-top">
<div class="logo">VERA<br>COSMIQUE<br><small>ALOE VERA • LUXE</small></div>
<a href="https://wa.me/22241176023" class="btn-top">41176023</a>
</div>
<div class="search-row">
<div class="search"><input id="q" placeholder="Rechercher... 100ml, 250ml, 500ml, Pack" onkeyup="search()"><button>🔍</button></div>
</div>
</header>
<div class="hero">
<h1>VERA COSMIQUE<span>ALOE VERA SERUM</span></h1>
<p>100% NATUREL • NOURISH & REPAIR • LUXE</p>
<img src="vera_hero.jpg">
</div>
